version: "2"
type: frontend
tech_stack:
  - TypeScript
  - React
  - React Router
  - Material UI
  - Vite
routes:
  - path: /login
    file: src/pages/Login.tsx
    auth_required: false
    description: Login page for local credential-based sign-in
  - path: /
    file: src/pages/ProductCatalog.tsx
    auth_required: false
    description: Product listing with view details and buy actions
  - path: /product/:id
    file: src/pages/ProductDetails.tsx
    auth_required: false
    description: Product detail view by id
  - path: /orders
    file: src/pages/OrderHistory.tsx
    auth_required: true
    description: Auth-protected order history page
  - path: /admin
    file: src/pages/AdminPage.tsx
    auth_required: true
    description: Auth-protected admin product management page
features:
  - name: User Login
    description: User logs in with fixed local test credentials and is redirected to catalog
    files:
      - src/pages/Login.tsx
      - src/App.tsx
    entry_route: /login
    user_interactions:
      - Enter email in the Email input
      - Enter password in the Password input
      - Click Login button
      - Observe redirect to catalog on success
      - Observe Invalid credentials message on failure
    api_calls: []
    auth_required: false
  - name: Browse Product Catalog
    description: View product cards loaded from mock data and navigate to details
    files:
      - src/pages/ProductCatalog.tsx
      - src/mockData.ts
    entry_route: /
    user_interactions:
      - Open catalog route
      - Wait for products to load
      - Click View Details on a product card
      - Navigate to selected product details
    api_calls: []
    auth_required: false
  - name: View Product Details
    description: View a single product by route param and see error when not found
    files:
      - src/pages/ProductDetails.tsx
      - src/mockData.ts
    entry_route: /product/:id
    user_interactions:
      - Open product detail URL with a valid id
      - Read product image, metadata, and description
      - Open detail URL with invalid id and observe not found state
    api_calls: []
    auth_required: false
  - name: Purchase Flow Simulation
    description: Mock buy action redirects unauthenticated users to login and shows success snackbar when authenticated
    files:
      - src/pages/ProductCatalog.tsx
      - src/pages/ProductDetails.tsx
      - src/App.tsx
    entry_route: /
    user_interactions:
      - Click Buy while logged out and observe redirect to login
      - Log in using test credentials
      - Return to catalog or product details
      - Click Buy and observe Purchase successful snackbar
    api_calls: []
    auth_required: false
  - name: Order History Access
    description: Access order history entries after authentication
    files:
      - src/pages/OrderHistory.tsx
      - src/App.tsx
      - src/mockData.ts
    entry_route: /orders
    user_interactions:
      - Navigate to /orders while logged out and observe redirect to login
      - Log in successfully
      - Navigate to /orders and view order cards
    api_calls: []
    auth_required: true
  - name: Admin Product Management (UI Only)
    description: Add, edit, and delete products in local component state only
    files:
      - src/pages/AdminPage.tsx
      - src/App.tsx
      - src/mockData.ts
    entry_route: /admin
    user_interactions:
      - Navigate to /admin while logged out and observe redirect to login
      - Log in and open admin page
      - Fill product form and submit to add item
      - Click Edit to update product and submit
      - Click Delete to remove product
      - Observe snackbar confirmations
    api_calls: []
    auth_required: true
known_limitations:
  - issue: All data is mock/local and there is no backend persistence
    location: src/mockData.ts
    impact: State resets on page reload and changes are not durable
  - issue: Authentication is in-memory only and uses hardcoded test credentials
    location: src/pages/Login.tsx
    impact: No real user accounts, sessions, or secure auth
  - issue: Buy action and admin CRUD are simulated with snackbar feedback only
    location: src/pages/ProductCatalog.tsx
    impact: No real order creation or product updates in a backend