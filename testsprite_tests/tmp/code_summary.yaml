version: "2"
type: frontend
tech_stack:
  - language: TypeScript
  - framework: Vite
  - ui_library: React, Material UI
  - other: serve (static hosting)
routes:
  - path: /
    file: src/pages/ProductCatalog.tsx
    auth_required: false
    description: Product catalog (home page)
  - path: /login
    file: src/pages/Login.tsx
    auth_required: false
    description: User login page
  - path: /order-history
    file: src/pages/OrderHistory.tsx
    auth_required: true
    description: User order history
  - path: /admin
    file: src/pages/AdminPage.tsx
    auth_required: true
    description: Admin product management
  - path: /product/:id
    file: src/pages/ProductDetails.tsx
    auth_required: false
    description: Product details page
features:
  - name: Product Catalog
    description: Browse and buy products
    files:
      - src/pages/ProductCatalog.tsx
    entry_route: /
    user_interactions:
      - View product list
      - Click "View Details" for a product
      - Click "Buy" (if logged in)
    api_calls: []
    auth_required: false
  - name: User Login
    description: Login with email and password credentials
    files:
      - src/pages/Login.tsx
    entry_route: /login
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Click Login button to submit
      - See error message on invalid credentials
    api_calls: []
    auth_required: false
  - name: Order History
    description: View past orders
    files:
      - src/pages/OrderHistory.tsx
    entry_route: /order-history
    user_interactions:
      - View order list
    api_calls: []
    auth_required: true
  - name: Admin Product Management
    description: Add, edit, and delete products (UI only)
    files:
      - src/pages/AdminPage.tsx
    entry_route: /admin
    user_interactions:
      - Add product
      - Edit product
      - Delete product
    api_calls: []
    auth_required: true
  - name: Product Details
    description: View product details and buy
    files:
      - src/pages/ProductDetails.tsx
    entry_route: /product/:id
    user_interactions:
      - View product details
      - Click "Buy" (if logged in)
    api_calls: []
    auth_required: false
known_limitations:
  - issue: Admin CRUD is UI-only, not connected to backend API
    location: src/pages/AdminPage.tsx
    impact: Create/update/delete only modify local state, not persisted
