type: frontend
tech_stack:
  - language: TypeScript
  - framework: Vite
  - ui_library: React, Material UI
  - other: serve (static hosting)
version: "2"
type: frontend
tech_stack:
  - language: TypeScript
  - framework: React
  - ui_library: Material-UI
  - other: Vite
routes:
  - path: /login
    file: src/pages/Login.tsx
    auth_required: false
    description: User login page
  - path: /
    file: src/pages/ProductCatalog.tsx
    auth_required: false
    description: Product catalog listing all products
  - path: /product/:id
    file: src/pages/ProductDetails.tsx
    auth_required: false
    description: Product details for a selected product
  - path: /orders
    file: src/pages/OrderHistory.tsx
    auth_required: true
    description: User's order history (protected)
  - path: /admin
    file: src/pages/AdminPage.tsx
    auth_required: true
    description: Admin page for managing products (UI only)
features:
  - name: User Login
    description: Login with email and password credentials
    files:
      - src/pages/Login.tsx
    entry_route: /login
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Click Login button to submit
      - See error message on invalid credentials
    api_calls: []
    auth_required: false
  - name: Browse Product Catalog
    description: View a list of available products
    files:
      - src/pages/ProductCatalog.tsx
    entry_route: /
    user_interactions:
      - Browse product cards
      - Click 'View Details' to see product info
      - Click 'Buy' to purchase (redirects to login if not authenticated)
    api_calls: []
    auth_required: false
  - name: View Product Details
    description: View detailed information for a selected product
    files:
      - src/pages/ProductDetails.tsx
    entry_route: /product/:id
    user_interactions:
      - View product image, name, description, price
      - Click 'Buy' to purchase (redirects to login if not authenticated)
    api_calls: []
    auth_required: false
  - name: Order History
    description: View list of past orders (protected)
    files:
      - src/pages/OrderHistory.tsx
    entry_route: /orders
    user_interactions:
      - View order cards with product info and date
    api_calls: []
    auth_required: true
  - name: Admin Product Management
    description: Add, edit, and delete products (UI only, not persisted)
    files:
      - src/pages/AdminPage.tsx
    entry_route: /admin
    user_interactions:
      - Add new product (open dialog, fill form, save)
      - Edit existing product
      - Delete product
    api_calls: []
    auth_required: true
known_limitations:
  - issue: Admin CRUD is UI-only, not connected to backend API
    location: src/pages/AdminPage.tsx
    impact: Create/update/delete only modify local state, not persisted
    auth_required: false
  - name: User Login
    description: Login with email and password credentials
    files:
      - src/pages/Login.tsx
    entry_route: /login
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Click Login button to submit
      - See error message on invalid credentials
    api_calls: []
    auth_required: false
  - name: Order History
    description: View past orders
    files:
      - src/pages/OrderHistory.tsx
    entry_route: /order-history
    user_interactions:
      - View order list
    api_calls: []
    auth_required: true
  - name: Admin Product Management
    description: Add, edit, and delete products (UI only)
    files:
      - src/pages/AdminPage.tsx
    entry_route: /admin
    user_interactions:
      - Add product
      - Edit product
      - Delete product
    api_calls: []
    auth_required: true
  - name: Product Details
    description: View product details and buy
    files:
      - src/pages/ProductDetails.tsx
    entry_route: /product/:id
    user_interactions:
      - View product details
      - Click "Buy" (if logged in)
    api_calls: []
    auth_required: false
known_limitations:
  - issue: Admin CRUD is UI-only, not connected to backend API
    location: src/pages/AdminPage.tsx
    impact: Create/update/delete only modify local state, not persisted
