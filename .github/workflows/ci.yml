name: Deploy and TestSprite E2E Tests 
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        id: deploy-step
        run: |
          # Deploy and capture JSON output
          DEPLOY_JSON=$(railway up --service c9f96532-df4f-4154-a836-a39275d26bf0 --environment production --json)
        env:
          RAILWAY_TOKEN: 4bb78f8b-55a0-410f-b01f-4481a3751f89



  integration-tests:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Generate App Token
        id: get_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.COMPANY_APP_ID }}
          private-key: ${{ secrets.COMPANY_APP_PRIVATE_KEY }}

      - name: TestSprite Action
        id: testsprite
        uses: TestSprite/github-action@main
        with:
          testsprite_api_key: 'sk-user-uM5Z1zV5bkrj5ET0GUVysYqDEUzzZwRfGkF1hmu6-cjph6-DB8UUo59h87SY1wITcpMXAHoCN1guA_-LDQxxuyZJhl2z96Poi79gaTo3N0rxKz1HL-poBJZrxHa0v75tc8k'
          github-token: ${{ steps.get_token.outputs.token }}
          base_url: 'https://ecommerce-platform-production-f7c4.up.railway.app'
